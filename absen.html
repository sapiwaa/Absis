<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Siswa</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="absen.css">
</head>
<body>

  <div class="sidebar">
    <h2>SMK NEGERI 1 KOTA BEKASI</h2>
    <ul>
      <li><a href="absen.html"><i class="ri-home-4-line"></i>Form Absensi</a></li>
      <li><a href="index.html"><i class="ri-logout-circle-line"></i>Keluar</a></li>
    </ul>
  </div>

  <div class="main">
    <div class="header">
      <h1>Form Absensi</h1>
    </div>

    <div id="beranda" class="content-page active">
      <p id="tanggal"></p>
      <p id="jam"></p>

      <form action="database/absen.php" method="POST" class="absen-form">

  <label for="nis">NIS</label>
  <input type="text" id="nis" name="nis" required>

  <label for="nama">Nama Lengkap</label>
  <input type="text" id="nama" name="nama" required>

  <label for="kelas">Kelas</label>
  <select id="kelas" name="kelas" required>
    <option value="">-- Pilih Kelas --</option>
    <option value="XI A">XI A</option>
    <option value="XI B">XI B</option>
  </select>

  <label for="jurusan">Jurusan</label>
  <select id="jurusan" name="jurusan" required>
    <option value="">-- Pilih Jurusan --</option>
    <option value="RPL">RPL</option>
    <option value="DKV">DKV</option>
    <option value="TKJ">TKJ</option>
  </select>

  <label for="keterangan">Keterangan</label>
  <select id="keterangan" name="keterangan" required>
    <option value="">-- Pilih Keterangan --</option>
    <option value="Hadir">Hadir</option>
    <option value="Izin">Izin</option>
    <option value="Sakit">Sakit</option>
  </select>

  <button type="submit">Kirim Absen</button>
</form>

    </div>
  </div>

  <script src="absen.js"></script>
</body>
</html>
